name: Quality

on:
  pull_request:
    branches: [dev-main, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: doggy_ent_vue/client
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.15.0'
          cache: npm
          cache-dependency-path: doggy_ent_vue/client/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Storefront artifact isolation
        run: npm run build:storefront
      - name: Admin artifact isolation
        run: npm run build:admin
        env:
          VITE_STOREFRONT_ORIGIN: https://storefront.example.test
      - run: npm test
      - name: Admin gateway runtime tests
        run: npm ci && npm test
        working-directory: doggy_ent_vue/admin
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: doggy_ent_vue/server
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.15.0'
          cache: npm
          cache-dependency-path: doggy_ent_vue/server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Git workflow helper tests
        run: node --test ../scripts/git-preflight.test.mjs
      - name: Read-only security inventory tests
        run: node --test ../scripts/security-preflight.test.mjs
